<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 800" role="img" aria-labelledby="title desc">
  <title id="title">Sunday en Wyoming cover</title>
  <desc id="desc">A playful digital humanities cover graphic for the interactive story.</desc>
  <defs>
    <linearGradient id="sky" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#f8e8ff"/>
      <stop offset="45%" stop-color="#d6f4ff"/>
      <stop offset="100%" stop-color="#fff3d6"/>
    </linearGradient>
    <linearGradient id="hill" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#8bc34a"/>
      <stop offset="100%" stop-color="#5a9a2f"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="1400" height="800" fill="url(#sky)"/>
  <circle cx="180" cy="145" r="86" fill="#ffffff" opacity="0.72" filter="url(#soft)"/>
  <circle cx="1225" cy="120" r="115" fill="#fff7bf" opacity="0.95" filter="url(#soft)"/>
  <circle cx="1090" cy="108" r="94" fill="#fff0a8" opacity="0.65" filter="url(#soft)"/>

  <path d="M0 565 C180 500, 300 510, 430 560 C580 620, 710 610, 860 550 C1010 490, 1160 480, 1400 560 L1400 800 L0 800 Z" fill="url(#hill)"/>
  <path d="M0 620 C220 575, 390 600, 520 650 C640 695, 780 695, 930 640 C1090 580, 1220 575, 1400 625 L1400 800 L0 800 Z" fill="#4f8a28" opacity="0.88"/>

  <rect x="120" y="520" width="1160" height="184" rx="40" fill="#ffffff" opacity="0.82"/>
  <rect x="155" y="555" width="1090" height="112" rx="28" fill="#ffffff" opacity="0.62"/>

  <text x="700" y="610" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="72" font-weight="800" fill="#243047">
    Sunday en Wyoming
  </text>
  <text x="700" y="662" text-anchor="middle" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, Arial, sans-serif" font-size="30" fill="#41536c">
    An interactive story built with Inky
  </text>

  <g opacity="0.9">
    <circle cx="300" cy="360" r="34" fill="#ff8ab3"/>
    <circle cx="340" cy="332" r="18" fill="#7be1ff"/>
    <circle cx="370" cy="368" r="14" fill="#fff08f"/>

    <circle cx="1080" cy="350" r="30" fill="#8f7dff"/>
    <circle cx="1120" cy="322" r="16" fill="#ffd36b"/>
    <circle cx="1148" cy="360" r="12" fill="#ff9c9c"/>
  </g>
</svg>